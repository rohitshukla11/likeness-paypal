allowBuilds:
  sharp: false
  unrs-resolver: false
  # esbuild's install script only checks for its platform binary (used by tsx and drizzle-kit).
  esbuild: true
  # No-op preinstall; protobufjs's postinstall only sets up its CLI. Neither is needed.
  "@google/genai": false
  protobufjs: false
  # Downloads its prebuilt native library (c2pa-rs) from the package's own GitHub release; no Rust build.
  "@contentauth/c2pa-node": true
